# MuJoCo training episodes for the sim fine-tune arm (docs/adr/0007,
# configs/jepa-wm/lewm_depth_residual_simft.yaml). Rendered once and cached:
#   uv run --extra sim quadwm sim-collect --sim-eval-config configs/sim/finetune_episodes.yaml
# Seeds start at 1000 so no terrain or episode matches an eval's (EV1-sim
# 0-7/100-103, EV2 200-203, EV3/EV4/EV6 0-1). Changing anything here changes
# the fine-tuning data: bump `name` and record why.
name: sim-finetune-v1
sim_config: mujoco_anymal.yaml

controller:                    # the sim evals' trot (configs/eval/sim.yaml), so the nominal gait matches
  frequency_hz: 1.5
  knee_lift: 0.7
  speed_per_stride: 1.6
  max_stride: 0.6
  heading_gain: 3.0

episodes:
  cache_root: ${QUADWM_SIM_CACHE_ROOT:-~/quad-wm-storage/cache/sim-episodes}
  splits: [train]
  modalities: [depth]          # the depth model's camera only; RGB would double the render time
  ticks: 120                   # 24 s at 5 Hz
  # The EV3 tiers' terrain kinds at their easier levels, 20 seeds each = 160 episodes.
  terrains: [[flat, 0.0], [rough, 0.02], [rough, 0.04], [slope, 10.0], [slope, 20.0], [stairs, 0.1],
             [steps, 0.1], [gaps, 0.1]]
  train_seeds: [1000, 1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009,
                1010, 1011, 1012, 1013, 1014, 1015, 1016, 1017, 1018, 1019]
  command_mps: [0.1, 0.6]      # per-episode command, uniform in this range
  heading_change_rad: 0.4
  action_noise_rad: 0.03       # i.i.d. per control frame, as in the EV1-sim episodes
  residual_noise_rad: 0.1      # per tick, per joint, held for the tick: the CEM residual's init_std
  window_stride_ticks: 1
