name: jepa-baseline-smoke
seed: 4551

run_root: ${QUADWM_RUN_ROOT:-/scratch/quad-wm/runs}
checkpoint_root: ${QUADWM_CHECKPOINT_ROOT:-/scratch/quad-wm/checkpoints}
data_config: configs/data/grandtour_smoke.yaml

cache:
  mode: auto
  root: ${QUADWM_CACHE_ROOT:-/scratch/quad-wm/cache/vjepa21-smoke}
  batch_size: 4

model:
  image_size: 384
  visual_dim: 768
  tokens_per_frame: 576
  proprio_dim: 33
  proprio_embed_dim: 16
  action_dim: 120
  context_steps: 1
  rollout_steps: 1
  rollout_context: 1
  predictor_depth: 1
  predictor_heads: 16

training:
  epochs: 1
  max_steps: 3
  per_gpu_batch_size: 1
  gradient_accumulation_steps: 1
  num_workers: 0
  precision: bf16
  learning_rate: 0.0005
  weight_decay: 0.0001
  clip_grad_norm: 1.0
  log_every_steps: 1
  eval_every_steps: 1
  eval_max_batches: 1
  resume: ""

wandb:
  enabled: ${QUADWM_WANDB_ENABLED:-true}
  project: jepa-wm
  name: jepa-baseline-smoke-${SLURM_JOB_ID:-local}
  group: jepa-baseline-smoke
  job_type: smoke
  tags:
    - slurm-${SLURM_JOB_ID:-local}
  mode: ${WANDB_MODE:-online}
