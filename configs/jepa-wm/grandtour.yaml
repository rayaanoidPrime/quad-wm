name: grandtour-inspection

# Keep this outside the Git checkout on the cluster.
data_root: ${GRANDTOUR_ROOT:-/path/to/grand_tour_dataset}
mission: ${GRANDTOUR_MISSION:-}

topics:
  depth: depth_camera_front_upper
  state: anymal_state_state_estimator
  actuator: anymal_state_actuator
  proprioception:
    - anymal_state_actuator
    - anymal_state_odometry
    - anymal_state_state_estimator

sync:
  max_gap_ms: 50
  base_clock: depth
  quaternion_order: xyzw
history_steps: 10

split:
  unit: mission
  eval_fraction: 0.2
