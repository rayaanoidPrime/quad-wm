name: track1-baseline-jepa
seed: 4551

run_root: ${QUADWM_RUN_ROOT:-/scratch/quad-wm/runs}
checkpoint_root: ${QUADWM_CHECKPOINT_ROOT:-/scratch/quad-wm/checkpoints}
data_config: configs/data/grandtour_track1.yaml

cache:
  mode: auto
  root: ${QUADWM_CACHE_ROOT:-/scratch/quad-wm/cache/vjepa21}
  batch_size: 16

model:
  baseline: true
  image_size: 384
  visual_dim: 768
  tokens_per_frame: 576
  proprio_dim: 33
  proprio_embed_dim: 16
  action_dim: 120
  context_steps: 7
  rollout_steps: 6
  rollout_context: 3
  predictor_depth: 12
  predictor_heads: 16

training:
  epochs: 10
  # One GPU, batch 8 keeps the effective batch at 8 (was 1 x accum 8) while
  # cutting micro-batches/epoch from 79,226 to 9,903. Peak VRAM ~80 GiB of 192.
  per_gpu_batch_size: 8
  gradient_accumulation_steps: 1
  num_workers: 0
  precision: bf16
  learning_rate: 0.0005
  weight_decay: 0.0001
  clip_grad_norm: 1.0
  log_every_steps: 10
  eval_every_steps: 200
  eval_max_batches: 8
  # Stable path so a job killed at the walltime resumes the next submission.
  resume: ${QUADWM_RUN_ROOT:-/scratch/quad-wm/runs}/track1-baseline-jepa/last.pt

wandb:
  enabled: ${QUADWM_WANDB_ENABLED:-true}
  project: quad-wm
  name: track1-baseline-jepa
  mode: ${WANDB_MODE:-online}
