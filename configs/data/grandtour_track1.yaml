data_root: ${GRANDTOUR_ROOT}

# No missions key means: enumerate and download every mission. Training uses
# all but the held-out eval split (recipe §2.4: mission-level, >=20%).
download: true
download_topics:
  - alphasense_front_center
  - anymal_state_state_estimator
  - anymal_state_actuator
observation: rgb_plus_proprioception
platform: anymal_d
tick_hz: 5
control_hz: 50
action_frames: 10
max_gap_ms: 50
sync_rate_hz: 10
calibration: per_mission

# Held-out evaluation: partition by mission, never train/probe/tune on these.
eval_fraction: 0.2
split_seed: 4551
eval_max_sequences: 256
