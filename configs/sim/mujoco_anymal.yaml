# MuJoCo ANYmal simulator (docs/adr/0003). Assets live outside Git and are
# fetched on first use (`uv sync --extra sim` installs robot_descriptions).
# Headless nodes: export MUJOCO_GL=egl.
name: sim-smoke
seed: 0
smoke_ticks: 25
smoke_terrains: [flat, rough, slope, stairs]

sim:
  backend: mujoco
  # STAND-IN: Menagerie ships ANYmal B/C, not D. Joint names and order match
  # GrandTour's ANYmal D; masses, link lengths and actuators do not.
  mjcf: ${QUADWM_SIM_ASSETS:-~/quad-wm-storage/assets}/mujoco_menagerie/anybotics_anymal_c/anymal_c.xml
  # If the file is missing, robot_descriptions (sim extra) fetches Menagerie
  # at its pinned commit into $QUADWM_SIM_ASSETS/mujoco_menagerie (~2 GB, once).
  mjcf_description: anymal_c_mj_description
  base_body: base
  # Same clock as configs/data/baseline.yaml: 5 Hz ticks of 10 x 50 Hz targets.
  tick_hz: 5
  control_hz: 50
  # Stiffer than Menagerie's kp=100 so the scripted trot (sim/controller.py)
  # holds a ~0.47 m base height and walks; docs/adr/0006.
  kp: 300.0
  kd: 8.0
  spawn_height: 0.62
  # JOINT_ORDER; the ANYmal standing pose used by Isaac Lab's ANYmal configs.
  default_joint_pos: [0.0, 0.4, -0.8, 0.0, 0.4, -0.8, 0.0, -0.4, 0.8, 0.0, -0.4, 0.8]
  terrain:
    length_m: 20.0
    width_m: 8.0
    cell_m: 0.05
  camera:
    # Placeholder mount; matching GrandTour's front camera (Boxi extrinsics,
    # fisheye, ~126x92 deg FoV) is an open compatibility test.
    pos: [0.45, 0.0, 0.10]
    pitch_deg: 20.0
    fovy_deg: 92.0
    width: 128
    height: 128
    modalities: [rgb, depth]
