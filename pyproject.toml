[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quad-wm"
version = "0.1.0"
description = "Collaborative infrastructure for quadruped world-model research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "huggingface-hub>=1.32.0",
  "einops>=0.8",
  "imageio>=2.37.4",
  "numpy>=1.26",
  "pillow>=10.0",
  "pytest>=9.1.1",
  "pyyaml>=6.0",
  "safetensors>=0.8.0",
  "scipy>=1.17.1",
  "torch>=2.7.1,<2.8",
  "tqdm>=4.66",
  "timm>=1.0",
  "wandb>=0.17",
  "zarr>=3.0,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
sim = [
  "mujoco>=3.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'win32'" },
  { index = "pytorch-rocm", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.2.4"

[project.scripts]
quadwm = "quadwm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quadwm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
